[project]
name = "django-shtrove"
version = "0.1.0"
description = ""
authors = [
    {name = "abram axel booth",email = "boothaa@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # TODO: consider moving src/shtrove/ to separate "shtrove==0.1.0",
    "primitive_metadata==0.2025.1",  # MIT
    "rdflib==7.6.0",  # BSD 3 Clause
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
]

[project.entry-points."shtrove.extract"]
turtle = "shtrove.extract.basic:TurtleExtract"
# TODO: jsonld =

[project.entry-points."shtrove.persist"]
django_shtrove_persist = "django_shtrove.persist:DjangoShtrovePersist"

[project.entry-points."shtrove.derive"]
# TODO: oai_dc?

[project.entry-points."shtrove.index"]
shtrovesearch_elastic8 = "django_shtrove.index:ShtrovesearchElastic8Index"

[project.entry-points."shtrove.render"]
html = "shtrove.render.html:HtmlRender"
turtle = "shtrove.render.turtle:TurtleRender"
jsonapi = "shtrove.render.jsonapi:JsonApiRender"
jsonld = "shtrove.render.jsonld:JsonLdRender"
shtrovesearch_csv = "shtrove.render.shtrovesearch_csv:ShtrovesearchCsvRender"
shtrovesearch_tsv = "shtrove.render.shtrovesearch_tsv:ShtrovesearchTsvRender"
shtrovesearch_json = "shtrove.render.shtrovesearch_json:ShtrovesearchJsonRender"

[dependency-groups]
lint = [
  'flake8',
  'mypy',
  'black',
]
test = [
  # TODO: 'coverage',
]

[tool.poetry]
packages = [
  {include = "django_shtrove", from = "src"},
  {include = "shtrove", from = "src"},
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# [tool.coverage.run]
# source = ['src']
# branch = true
#
# [tool.coverage.report]
# skip_covered = true
# show_missing = true

[tool.mypy]
strict = true
exclude_gitignore = true
