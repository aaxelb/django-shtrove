[flake8]
select = B,C,E,F,W,T4,B9
extend-ignore =
    # allow `def foo(): ...` on one line
    E701, E704,
    # let autoformat handle spaces before , ; :
    E203,
    # let autoformat handle line length
    E501,
    # allow ### comments
    E266,
    # prefer line break before binary operators
    W503,
exclude = .git,.tox,.venv,__pycache__
